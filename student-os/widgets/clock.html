<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#191919;font-family:"Helvetica Neue",Arial,sans-serif}
.wrap{display:flex;gap:6px;height:100%;padding:4px;box-sizing:border-box}
.card{flex:1;background:#5e9f6e;border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.card:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.18)}
.num{font-size:min(20vw,62vh);font-weight:700;letter-spacing:-2px;line-height:1}
.lbl{position:absolute;bottom:6px;font-size:min(3.4vw,9vh);font-weight:700;text-transform:uppercase}
.l{left:8px}.r{right:8px}
</style></head><body>
<div class="wrap"><div class="card"><span class="num" id="h">12</span><span class="lbl l" id="ap">UHR</span></div>
<div class="card"><span class="num" id="m">00</span><span class="lbl r" id="d">SONNTAG</span></div></div>
<script>
function t(){const n=new Date();
document.getElementById('h').textContent=String(n.getHours()).padStart(2,'0');document.getElementById('m').textContent=String(n.getMinutes()).padStart(2,'0');
document.getElementById('d').textContent=n.toLocaleDateString('de-DE',{weekday:'long'}).toUpperCase();}
t();setInterval(t,1000);
</script></body></html>
